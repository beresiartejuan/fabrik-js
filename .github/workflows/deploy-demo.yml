name: Deploy Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain
        run: pnpm --filter @fabrik/domain build

      - name: Test
        run: pnpm --filter @fabrik/web-demo test

      - name: Build static export
        run: pnpm --filter @fabrik/web-demo build
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/${{ github.event.repository.name }}'

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # `enablement: true` is useless with GITHUB_TOKEN (the action's
          # metadata requires a PAT/App token to create the Pages site).
          # Pages is enabled ONCE manually: Settings → Pages → Source:
          # "GitHub Actions". Here we only fetch the site config.
          enablement: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web-demo/out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5